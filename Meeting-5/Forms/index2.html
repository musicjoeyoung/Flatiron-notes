<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
    <script src="script2.js" defer></script>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <h1>Form 2</h1>

    <form id="myForm" class="form">
        <h2>Student Sign-Up Form</h2>
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="enter name" required />

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="enter email" required />

        <label for="confirmEmail">Confirm Email: </label>
        <input type="email" id="confirmEmail" placeholder="confirm email" required />
        
        <label for="phone">Phone: </label>
        <input type="tel" id="phone" placeholder="enter phone" />

        <label for="message">Message: </label>
        <textarea id="message" placeholder="enter message"></textarea>


        <label for="hotdog">Is a hotdog a sandwich?</label>
        <select id="hotdog">
            <option value="isSandwich">Yes</option>
            <option value="isNotSandwich">No</option>
            <option value="other">It's a third thing</option>
        </select>

        <button>Submit</button>
    </form>

    <div id="formSubmissions"></div>
</body>
</html>
